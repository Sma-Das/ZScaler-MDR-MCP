name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
concurrency:
  group: release
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release ref
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          git merge-base --is-ancestor HEAD origin/main
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.x
          cache-dependency-path: go/go.sum
      - run: make ci
  container:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Release version
        id: version
        run: echo "value=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a
        id: build
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/zscaler-mdr-mcp:${{ steps.version.outputs.value }}
            ${{ vars.DOCKERHUB_USERNAME }}/zscaler-mdr-mcp:latest
          build-args: VERSION=${{ steps.version.outputs.value }}
          provenance: mode=max
          sbom: true
          labels: |
            org.opencontainers.image.source=https://github.com/Sma-Das/ZScaler-MDR-MCP
            org.opencontainers.image.description=Read-only Zscaler MDR and Red Canary MCP server
            org.opencontainers.image.licenses=Apache-2.0
      - run: echo 'Container digest ${{ steps.build.outputs.digest }}' >> "$GITHUB_STEP_SUMMARY"
  binaries:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version: 1.26.x
          cache-dependency-path: go/go.sum
      - name: Build checksummed archives
        run: |
          set -euo pipefail
          mkdir -p dist/package
          version="${GITHUB_REF_NAME#v}"
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            binary=zscaler-mdr-mcp
            if [[ "$os" == windows ]]; then binary=zscaler-mdr-mcp.exe; fi
            (cd go && CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath -ldflags "-s -w -X github.com/Sma-Das/ZScaler-MDR-MCP/go/internal/mcpserver.Version=$version" -o "../dist/package/$binary" ./cmd/server)
            cp LICENSE dist/package/LICENSE
            tar -C dist/package -czf "dist/zscaler-mdr-mcp_${version}_${os}_${arch}.tar.gz" "$binary" LICENSE
            rm "dist/package/$binary"
          done
          rm dist/package/LICENSE
          rmdir dist/package
          (cd dist && sha256sum *.tar.gz > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --generate-notes --title "Zscaler MDR MCP $GITHUB_REF_NAME"
